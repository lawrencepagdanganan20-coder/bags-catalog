      { id: 's15', name: 'CLN Blaire Shoulder Bag', category: 'Shoulder Bags', image: 'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=600&q=80' },
      { id: 's16', name: 'CLN Connie Shoulder Bag', category: 'Shoulder Bags', image: 'https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=600&q=80' },
      { id: 's17', name: 'CLN Maren Shoulder Bag', category: 'Shoulder Bags', image: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=600&q=80' },
      { id: 's18', name: 'CLN Safira Shoulder Bag', category: 'Shoulder Bags', image: 'https://images.unsplash.com/photo-1584916201218-f4242ceb4809?auto=format&fit=crop&w=600&q=80' },
      { id: 's19', name: 'CLN Althea Shoulder Bag', category: 'Shoulder Bags', image: 'https://images.unsplash.com/photo-1591561954557-26941169b49e?auto=format&fit=crop&w=600&q=80' },
      { id: 's20', name: 'CLN Amaya Shoulder Bag', category: 'Shoulder Bags', image: 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80' },
      { id: 's21', name: 'CLN Jordaine Shoulder Bag', category: 'Shoulder Bags', image: 'https://images.unsplash.com/photo-1598532163257-ae3c6b2524b6?auto=format&fit=crop&w=600&q=80' },

      // Crossbody Bags
      { id: 'c1', name: 'CLN 0824S-Satchi Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=600&q=80' },
      { id: 'c2', name: 'CLN 0522S-Rosabella Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=600&q=80' },
      { id: 'c3', name: 'CLN 1121S-Carizza Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1584916201218-f4242ceb4809?auto=format&fit=crop&w=600&q=80' },

      { id: 'c6', name: 'CLN 1225S-Hally Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1598532163257-ae3c6b2524b6?auto=format&fit=crop&w=600&q=80' },
      { id: 'c7', name: 'CLN 0525S-Floris Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?auto=format&fit=crop&w=600&q=80' },
      { id: 'c8', name: 'CLN 1225D-Lilith Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?auto=format&fit=crop&w=600&q=80' },
      { id: 'c9', name: 'CLN Malorie Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=600&q=80' },
      { id: 'c10', name: 'CLN Paulette Crossbody Bag', category: 'Crossbody Bags', image: 'https://images.unsplash.com/photo-1584916201218-f4242ceb4809?auto=format&fit=crop&w=600&q=80' }
    ];

    const categories = ['All', 'Favorites', 'Tote Bags', 'Handbags', 'Shoulder Bags', 'Crossbody Bags'];

    function App() {
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('All');
      const [favoriteIds, setFavoriteIds] = useState([]);

      const toggleFavorite = (id) => {
        setFavoriteIds(prev =>
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const filteredBags = useMemo(() => {
        return BAGS_DATA.filter(bag => {
          const matchesSearch = bag.name.toLowerCase().includes(searchQuery.toLowerCase());
          const isFav = favoriteIds.includes(bag.id);

          if (activeCategory === 'Favorites') {
            return isFav && matchesSearch;
          }
          if (activeCategory === 'All') {
            return matchesSearch;
          }
          return bag.category === activeCategory && matchesSearch;
        });
      }, [searchQuery, activeCategory, favoriteIds]);

      return (
        <div class="min-h-screen">
          {/* Header */}
          <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-pink-100 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="text-center md:text-left">
                  <h1 class="font-serif text-3xl font-bold tracking-tight text-rose-500">CLN Bags Catalog</h1>
                  <p class="text-xs text-pink-400 font-medium tracking-wide uppercase mt-0.5">Modest Elegance & Timeless Style</p>
                </div>

                <div class="relative w-full md:w-80">
                  <input
                    type="text"
                    placeholder="Search CLN bag models..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    class="w-full pl-10 pr-4 py-2 bg-pink-50/50 rounded-full border border-pink-200 text-sm text-gray-700 placeholder-pink-300 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all"
                  />
                  <span class="absolute left-3.5 top-2.5 text-pink-300">🔍</span>
                </div>
              </div>
            </div>
          </header>

          {/* Quote Hero Banner */}
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-4">
            <div class="bg-gradient-to-r from-pink-100 via-rose-100/60 to-pink-100 border border-pink-200/60 rounded-3xl p-6 sm:p-8 text-center shadow-sm relative overflow-hidden">
              <div class="relative z-10 max-w-2xl mx-auto">
                <span class="text-rose-400 text-2xl font-serif">“</span>
                <p class="font-serif italic text-lg sm:text-xl text-rose-800 leading-relaxed font-normal">
                  To fall in love with elegance is to embrace the simplicity of being yourself.
                </p>
                <span class="text-rose-400 text-2xl font-serif">”</span>
                <p class="text-xs text-rose-500 font-medium tracking-widest uppercase mt-3">— CLN Modest Elegance</p>
              </div>
            </div>
          </div>

          {/* Category Tabs */}
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-center sm:justify-start gap-2 overflow-x-auto pb-4 scrollbar-none">
              {categories.map((category) => {
                const isFav = category === 'Favorites';
                const isActive = activeCategory === category;
                return (
                  <button
                    key={category}
                    onClick={() => setActiveCategory(category)}
                    class={`relative px-5 py-2.5 rounded-full text-sm font-medium transition-all duration-300 flex items-center gap-2 border shadow-sm ${
                      isActive
                        ? 'bg-rose-400 text-white border-rose-400 shadow-rose-200 scale-105'
                        : 'bg-white text-gray-600 border-pink-100 hover:bg-rose-50 hover:text-rose-500 hover:border-pink-200'
                    }`}
                  >
                    {isFav && <span>❤️</span>}
                    {category}
                    {isFav && (
                      <span class={`ml-1 px-2 py-0.5 rounded-full text-xs font-semibold ${
                        isActive ? 'bg-white text-rose-500' : 'bg-rose-100 text-rose-600'
                      }`}>
                        {favoriteIds.length}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>

            {/* Bag Grid */}
            {filteredBags.length > 0 ? (
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
                {filteredBags.map((bag) => {
                  const isHearted = favoriteIds.includes(bag.id);
                  return (
                    <div
                      key={bag.id}
                      class="bg-white rounded-2xl overflow-hidden border border-pink-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col group"
                    >
                      {/* Image container */}
                      <div class="relative aspect-square overflow-hidden bg-pink-50/50">
                        <img
                          src={bag.image}
                          alt={bag.name}
                          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-xs font-medium text-rose-500 px-3 py-1 rounded-full shadow-sm border border-pink-100">
                          {bag.category}
                        </span>
                        
                        {/* Heart Button */}
                        <button
                          onClick={() => toggleFavorite(bag.id)}
                          class="absolute top-3 right-3 p-2 rounded-full bg-white/90 backdrop-blur-md text-rose-400 hover:text-rose-600 hover:scale-110 active:scale-95 transition-all shadow-md border border-pink-100"
                        >
                          {isHearted ? '❤️' : '🤍'}
                        </button>
                      </div>

                      {/* Card Content */}
                      <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <h3 class="font-semibold text-gray-800 text-base group-hover:text-rose-500 transition-colors line-clamp-2">
                            {bag.name}
                          </h3>
                          <p class="text-xs text-gray-400 mt-1">CLN Official</p>
                        </div>

                        <div class="mt-4 pt-3 border-t border-pink-50 flex items-center justify-between">
                          <span class="text-xs text-pink-400 font-medium">Authentic Style</span>
                          <button
                            onClick={() => toggleFavorite(bag.id)}
                            class="text-xs font-medium text-rose-400 hover:text-rose-600 transition-colors flex items-center gap-1"
                          >
                            {isHearted ? '❤️ Hearted' : '🤍 Heart bag'}
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div class="text-center py-16 bg-white/60 rounded-3xl border border-dashed border-pink-200 mt-6">
                <p class="text-4xl mb-3">🛍️</p>
                <h3 class="font-serif text-lg text-gray-700 font-semibold">
                  {activeCategory === 'Favorites' ? 'No Favorited Bags Yet' : 'No Bags Found'}
                </h3>
                <p class="text-sm text-gray-400 mt-1 max-w-sm mx-auto">
                  {activeCategory === 'Favorites' 
                    ? 'Tap the heart icon on any CLN bag to add it to your personal favorites collection!' 
                    : 'Try adjusting your search or category filter to discover more styles.'}
                </p>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
