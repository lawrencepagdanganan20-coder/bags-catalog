<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLN Bags Catalog</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-50 via-rose-50/30 to-pink-100 min-h-screen text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const BAGS_DATA = [
      // Tote Bags
      { id: 't1', name: 'CLN 0621T-Karoline Tote Bag', category: 'Tote Bags', image: './images/karoline.avif' },
      { id: 't2', name: 'CLN 0422T-Kiarra Tote Bag', category: 'Tote Bags', image: './images/kiarra.avif' },
      { id: 't3', name: 'CLN 0824T-Karrie Tote Bag', category: 'Tote Bags', image: './images/karrie.avif' },
      { id: 't4', name: 'CLN 0924T-Steffi Totebag', category: 'Tote Bags', image: './images/steffi.avif' },
      { id: 't5', name: 'CLN Lizzie Tote Bag', category: 'Tote Bags', image: './images/lizzie.avif' },

      // Handbags
      { id: 'h1', name: 'CLN 0521H-Addeline Handbag', category: 'Handbags', image: './images/addeline.avif' },
      { id: 'h2', name: 'CLN 0724H-Tattah Handbag', category: 'Handbags', image: './images/tattah.avif' },
      { id: 'h3', name: 'CLN 0325H-Trevor Handbag', category: 'Handbags', image: './images/trevor.avif' },
      { id: 'h4', name: 'CLN 1125D-Armina Handbag', category: 'Handbags', image: './images/armina.avif' },
      { id: 'h5', name: 'CLN Vienne Handbag', category: 'Handbags', image: './images/vienne.avif' },
      { id: 'h6', name: 'CLN Vera Handbag', category: 'Handbags', image: './images/vera.avif' },
      { id: 'h7', name: 'CLN Lianne Handbag', category: 'Handbags', image: './images/lianne.avif' },
      { id: 'h8', name: 'CLN Ethel Handbag', category: 'Handbags', image: './images/ethel.avif' },
      { id: 'h9', name: 'CLN Farlane Handbag', category: 'Handbags', image: './images/farlane.avif' },
      { id: 'h10', name: 'CLN Puff Handbag', category: 'Handbags', image: './images/puff.avif' },
      { id: 'h11', name: 'CLN Fumi Handbag', category: 'Handbags', image: './images/fumi.avif' },
      { id: 'h12', name: 'CLN Adora Handbag', category: 'Handbags', image: './images/adora.avif' },
      { id: 'h13', name: 'CLN Danny Handbag', category: 'Handbags', image: './images/danny.avif' },
      { id: 'h14', name: 'CLN Lyra Handbag', category: 'Handbags', image: './images/lyra.avif' },
      { id: 'h15', name: 'CLN Arceli Handbag', category: 'Handbags', image: './images/arceli.avif' },
      { id: 'h16', name: 'CLN Staku Handbag', category: 'Handbags', image: './images/staku.avif' },

      // Shoulder Bags
      { id: 's1', name: 'CLN 0125D-Chandria Shoulder Bag', category: 'Shoulder Bags', image: './images/chandria.avif' },
      { id: 's2', name: 'CLN 1123O-Ohaine Shoulder Bag', category: 'Shoulder Bags', image: './images/ohaine.avif' },
      { id: 's3', name: 'CLN 0925O-Solana Shoulder Bag', category: 'Shoulder Bags', image: './images/solana.avif' },
      { id: 's4', name: 'CLN 0925D-Chanellie Shoulder Bag', category: 'Shoulder Bags', image: './images/chanellie.avif' },
      { id: 's5', name: 'CLN 1025U-Jesanie Shoulder Bag', category: 'Shoulder Bags', image: './images/jesanie.avif' },
      { id: 's6', name: 'CLN 1225D-Aleyah Shoulder Bag', category: 'Shoulder Bags', image: './images/aleyah.avif' },
      { id: 's7', name: 'CLN 1225D-Macrene Shoulder Bag', category: 'Shoulder Bags', image: './images/macrene.avif' },
      { id: 's8', name: 'CLN 1025D-Sammy Shoulder Bag', category: 'Shoulder Bags', image: './images/sammy.avif' },
      { id: 's9', name: 'CLN 0925D-Leira Shoulder Bag', category: 'Shoulder Bags', image: './images/leira.avif' },
      { id: 's10', name: 'CLN 1025D-Khaira Shoulder Bag', category: 'Shoulder Bags', image: './images/khaira.avif' },
      { id: 's11', name: 'CLN 0925O-Aviary Shoulder Bag', category: 'Shoulder Bags', image: './images/aviary.avif' },
      { id: 's12', name: 'CLN 1225D-Rory Shoulder Bag', category: 'Shoulder Bags', image: './images/rory.avif' },
      { id: 's13', name: 'CLN 1225H-Hillary Shoulder Bag', category: 'Shoulder Bags', image: './images/hillary.avif' },
      { id: 's14', name: 'CLN 0525H-Thelma Shoulder Bag', category: 'Shoulder Bags', image: './images/thelma.avif' },
      { id: 's16', name: 'CLN Connie Shoulder Bag', category: 'Shoulder Bags', image: './images/connie.avif' },
      { id: 's17', name: 'CLN Maren Shoulder Bag', category: 'Shoulder Bags', image: './images/maren.avif' },
      { id: 's18', name: 'CLN Safira Shoulder Bag', category: 'Shoulder Bags', image: './images/safira.avif' },
      { id: 's19', name: 'CLN Althea Shoulder Bag', category: 'Shoulder Bags', image: './images/althea.avif' },
      { id: 's20', name: 'CLN Amaya Shoulder Bag', category: 'Shoulder Bags', image: './images/amaya.avif' },
      { id: 's21', name: 'CLN Jordaine Shoulder Bag', category: 'Shoulder Bags', image: './images/jordaine.avif' },
      { id: 's22', name: 'CLN Larkin Shoulder Bag', category: 'Shoulder Bags', image: './images/larkin.avif' },

      // Crossbody Bags
      { id: 'c1', name: 'CLN 0824S-Satchi Crossbody Bag', category: 'Crossbody Bags', image: './images/satchi.avif' },
      { id: 'c2', name: 'CLN 0522S-Rosabella Crossbody Bag', category: 'Crossbody Bags', image: './images/rosabella.avif' },
      { id: 'c3', name: 'CLN 1121S-Carizza Crossbody Bag', category: 'Crossbody Bags', image: './images/carizza.avif' },
      { id: 'c4', name: 'CLN 0223S-Aquila Crossbody Bag', category: 'Crossbody Bags', image: './images/aquila.avif' },
      { id: 'c5', name: 'CLN 0924S-Shyrine Crossbody Bag', category: 'Crossbody Bags', image: './images/shyrine.avif' },
      { id: 'c6', name: 'CLN 1225S-Hally Crossbody Bag', category: 'Crossbody Bags', image: './images/hally.avif' },
      { id: 'c7', name: 'CLN 0525S-Floris Crossbody Bag', category: 'Crossbody Bags', image: './images/floris.avif' },
      { id: 'c8', name: 'CLN 1225D-Lilith Crossbody Bag', category: 'Crossbody Bags', image: './images/lilith.avif' },
      { id: 'c9', name: 'CLN Malorie Crossbody Bag', category: 'Crossbody Bags', image: './images/malorie.avif' },
      { id: 'c10', name: 'CLN Paulette Crossbody Bag', category: 'Crossbody Bags', image: './images/paulette.avif' }
    ];

    const categories = ['All', 'Favorites', 'Tote Bags', 'Handbags', 'Shoulder Bags', 'Crossbody Bags'];

    function App() {
      const [searchQuery, setSearchQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState('All');
      const [favoriteIds, setFavoriteIds] = useState([]);
      const [selectedBag, setSelectedBag] = useState(null);

      const toggleFavorite = (id, e) => {
        if (e) e.stopPropagation();
        setFavoriteIds(prev =>
          prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
        );
      };

      const filteredBags = useMemo(() => {
        return BAGS_DATA.filter(bag => {
          const matchesSearch = bag.name.toLowerCase().includes(searchQuery.toLowerCase());
          const isFav = favoriteIds.includes(bag.id);

          if (activeCategory === 'Favorites') {
            return isFav && matchesSearch;
          }
          if (activeCategory === 'All') {
            return matchesSearch;
          }
          return bag.category === activeCategory && matchesSearch;
        });
      }, [searchQuery, activeCategory, favoriteIds]);

      return (
        <div class="min-h-screen relative">
          {/* Header */}
          <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-pink-100 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
              <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="text-center md:text-left">
                  <h1 class="font-serif text-3xl font-bold tracking-tight text-rose-500">CLN Bags Catalog</h1>
                  <p class="text-xs text-pink-400 font-medium tracking-wide uppercase mt-0.5">Catalog Made Only For You</p>
                </div>

                <div class="relative w-full md:w-80">
                  <input
                    type="text"
                    placeholder="Search CLN bag models..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    class="w-full pl-10 pr-4 py-2 bg-pink-50/50 rounded-full border border-pink-200 text-sm text-gray-700 placeholder-pink-300 focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all"
                  />
                  <span class="absolute left-3.5 top-2.5 text-pink-300">🔍</span>
                </div>
              </div>
            </div>
          </header>

          {/* Color Availability Note */}
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            <div class="bg-rose-50 border border-rose-200/80 text-rose-700 text-xs sm:text-sm px-4 py-2.5 rounded-full text-center shadow-sm flex items-center justify-center gap-2">
              <span>🎨</span>
              <span class="font-medium">Note: Additional color variants are available for select bag models!</span>
            </div>
          </div>

          {/* Quote Hero Banner */}
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-4">
            <div class="bg-gradient-to-r from-pink-100 via-rose-100/60 to-pink-100 border border-pink-200/60 rounded-3xl p-6 sm:p-8 text-center shadow-sm relative overflow-hidden">
              <div class="relative z-10 max-w-2xl mx-auto">
                <span class="text-rose-400 text-2xl font-serif">“</span>
                <p class="font-serif italic text-lg sm:text-xl text-rose-800 leading-relaxed font-normal">
                  To fall in love with elegance is to embrace the simplicity of being yourself.
                </p>
                <span class="text-rose-400 text-2xl font-serif">”</span>
                <p class="text-xs text-rose-500 font-medium tracking-widest uppercase mt-3">— CLN Modest Elegance</p>
              </div>
            </div>
          </div>

          {/* Category Tabs */}
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-center sm:justify-start gap-2 overflow-x-auto pb-4 scrollbar-none">
              {categories.map((category) => {
                const isFav = category === 'Favorites';
                const isActive = activeCategory === category;
                return (
                  <button
                    key={category}
                    onClick={() => setActiveCategory(category)}
                    class={`relative px-5 py-2.5 rounded-full text-sm font-medium transition-all duration-300 flex items-center gap-2 border shadow-sm ${
                      isActive
                        ? 'bg-rose-400 text-white border-rose-400 shadow-rose-200 scale-105'
                        : 'bg-white text-gray-600 border-pink-100 hover:bg-rose-50 hover:text-rose-500 hover:border-pink-200'
                    }`}
                  >
                    {isFav && <span>❤️</span>}
                    {category}
                    {isFav && (
                      <span class={`ml-1 px-2 py-0.5 rounded-full text-xs font-semibold ${
                        isActive ? 'bg-white text-rose-500' : 'bg-rose-100 text-rose-600'
                      }`}>
                        {favoriteIds.length}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>

            {/* Bag Grid */}
            {filteredBags.length > 0 ? (
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
                {filteredBags.map((bag) => {
                  const isHearted = favoriteIds.includes(bag.id);
                  return (
                    <div
                      key={bag.id}
                      onClick={() => setSelectedBag(bag)}
                      class="bg-white rounded-2xl overflow-hidden border border-pink-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col group cursor-pointer"
                    >
                      {/* Image container */}
                      <div class="relative aspect-square overflow-hidden bg-pink-50/50">
                        <img
                          src={bag.image}
                          alt={bag.name}
                          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                          onError={(e) => {
                            e.target.onerror = null; 
                            e.target.src = 'https://via.placeholder.com/400x400/fff0f5/e11d48?text=CLN+Bag';
                          }}
                        />
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-xs font-medium text-rose-500 px-3 py-1 rounded-full shadow-sm border border-pink-100">
                          {bag.category}
                        </span>
                        
                        {/* Zoom Indicator overlay badge */}
                        <span class="absolute bottom-3 left-3 bg-rose-500/80 backdrop-blur-md text-[10px] text-white px-2.5 py-0.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                          🔍 Tap to Zoom
                        </span>

                        {/* Heart Button */}
                        <button
                          onClick={(e) => toggleFavorite(bag.id, e)}
                          class="absolute top-3 right-3 p-2 rounded-full bg-white/90 backdrop-blur-md text-rose-400 hover:text-rose-600 hover:scale-110 active:scale-95 transition-all shadow-md border border-pink-100"
                        >
                          {isHearted ? '❤️' : '🤍'}
                        </button>
                      </div>

                      {/* Card Content */}
                      <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                          <h3 class="font-semibold text-gray-800 text-base group-hover:text-rose-500 transition-colors line-clamp-2">
                            {bag.name}
                          </h3>
                          <p class="text-xs text-gray-400 mt-1">CLN Official</p>
                        </div>

                        <div class="mt-4 pt-3 border-t border-pink-50 flex items-center justify-between">
                          <span class="text-xs text-pink-400 font-medium">Authentic Style</span>
                          <button
                            onClick={(e) => toggleFavorite(bag.id, e)}
                            class="text-xs font-medium text-rose-400 hover:text-rose-600 transition-colors flex items-center gap-1"
                          >
                            {isHearted ? '❤️ Hearted' : '🤍 Heart bag'}
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div class="text-center py-16 bg-white/60 rounded-3xl border border-dashed border-pink-200 mt-6">
                <p class="text-4xl mb-3">🛍️</p>
                <h3 class="font-serif text-lg text-gray-700 font-semibold">
                  {activeCategory === 'Favorites' ? 'No Favorited Bags Yet' : 'No Bags Found'}
                </h3>
                <p class="text-sm text-gray-400 mt-1 max-w-sm mx-auto">
                  {activeCategory === 'Favorites' 
                    ? 'Tap the heart icon on any CLN bag to add it to your personal favorites collection!' 
                    : 'Try adjusting your search or category filter to discover more styles.'}
                </p>
              </div>
            )}
          </main>

          {/* Zoom Modal Overlay */}
          {selectedBag && (
            <div 
              class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 transition-all duration-300"
              onClick={() => setSelectedBag(null)}
            >
              <div 
                class="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border border-pink-100 relative flex flex-col max-h-[90vh] animate-in fade-in zoom-in duration-200"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Modal Top Bar */}
                <div class="p-4 bg-rose-50/80 border-b border-pink-100 flex items-center justify-between">
                  <button
                    onClick={() => setSelectedBag(null)}
                    class="px-4 py-2 rounded-full bg-rose-500 hover:bg-rose-600 text-white text-xs sm:text-sm font-semibold transition-all shadow-md flex items-center gap-1.5 active:scale-95"
                  >
                    ← Back to Catalog
                  </button>

                  <button
                    onClick={(e) => toggleFavorite(selectedBag.id, e)}
                    class="px-3.5 py-1.5 rounded-full bg-white border border-pink-200 text-xs sm:text-sm font-medium text-rose-500 hover:bg-rose-50 transition-colors flex items-center gap-1"
                  >
                    {favoriteIds.includes(selectedBag.id) ? '❤️ Hearted' : '🤍 Heart Bag'}
                  </button>
                </div>

                {/* Zoomed Image */}
                <div class="relative overflow-auto flex-1 flex items-center justify-center bg-pink-50/30 p-4 min-h-[300px]">
                  <img
                    src={selectedBag.image}
                    alt={selectedBag.name}
                    class="max-h-[60vh] w-auto object-contain rounded-xl shadow-md"
                    onError={(e) => {
                      e.target.onerror = null; 
                      e.target.src = 'https://via.placeholder.com/600x600/fff0f5/e11d48?text=CLN+Bag';
                    }}
                  />
                </div>

                {/* Modal Footer */}
                <div class="p-6 bg-white border-t border-pink-100">
                  <span class="inline-block bg-pink-100 text-rose-600 text-xs font-semibold px-3 py-1 rounded-full mb-2">
                    {selectedBag.category}
                  </span>
                  <h2 class="text-xl sm:text-2xl font-serif font-bold text-gray-800">
                    {selectedBag.name}
                  </h2>
                  <p class="text-xs text-pink-400 font-medium mt-1">CLN Official Store Product</p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
